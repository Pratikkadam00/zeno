appId: app.zeno.mobile
name: Notifications blocked by the phone - the app says reminders won't appear (F192), and stops saying it once allowed
tags: [notifications]
---
# The phone's answer is set at launch, before the app can ask. Until F230
# (2026-10-09) the app skipped the request on an emulator entirely, because it
# was tied to fetching a push token nothing used; it now asks wherever it runs,
# so the answer has to be decided here or the dialog lands mid-flow.
- clearState
- launchApp:
    permissions:
      notifications: deny
- tapOn: "Continue"
- tapOn: "Continue"
- tapOn: "Continue without an account"
# A revoke leaves the permission ASKABLE, so the platform prompts anyway:
# measured on the emulator on 2026-10-09 (granted -> no dialog; revoked -> the
# dialog appears a beat after the ledger opens). Refusing here is what puts the
# app in the state this flow is about. A COLD start would be asked again, which
# is Android's own two-strike rule, not ours; the relaunches below all pass
# stopApp: false, so the app resumes and never re-asks inside this flow.
- extendedWaitUntil:
    visible: "Don.t allow"
    timeout: 10000
- tapOn: "Don.t allow"
- assertVisible: "Your ledger"
- runFlow: common/add-netflix.yaml
- tapOn: "Notifications"
- assertVisible: "Notifications are off for Zeno"
- assertVisible: "Reminders won't appear until you allow them in your phone's settings\\."
# The reminders still listed are what WOULD fire once allowed.
- assertVisible: ".*Netflix.*"
- tapOn: "Go back"
- tapOn: "Settings"
- scrollUntilVisible:
    element: "BLOCKED IN PHONE SETTINGS"
    direction: DOWN
# Allowed: the notice goes (re-read when the app returns to the foreground).
- launchApp:
    stopApp: false
    permissions:
      notifications: allow
- pressKey: Home
- launchApp:
    stopApp: false
- assertNotVisible: "BLOCKED IN PHONE SETTINGS"
- assertVisible: "7D · 3D · DAY OF"
