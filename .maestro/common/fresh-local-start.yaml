appId: app.zeno.mobile
name: (subflow) fresh install, onboarding, continue without an account
---
- clearState
# F230 (2026-10-09) changed when the phone is asked about notifications. The app
# used to skip that request on an emulator (it was tied to fetching a push token
# the app never used), so no dialog ever appeared here. It now asks wherever it
# runs, and the dialog arrives a moment AFTER the ledger opens — mid-flow, over
# whatever is on screen. `clearState` above revokes runtime permissions, so the
# answer is decided here, at launch, before the app can ask.
- launchApp:
    permissions:
      notifications: allow
- assertVisible: "Step 1 of 3"
- tapOn: "Continue"
- assertVisible: "Step 2 of 3"
- tapOn: "Continue"
- assertVisible: "Step 3 of 3"
- tapOn: "Continue without an account"
# Belt and braces: if a build or an Android version asks anyway, take the
# dialog out of the way rather than letting it fail the next step.
- tapOn:
    text: "Allow"
    optional: true
# The ledger's first paint can take longer than the default wait on a loaded
# runner: the nightly of 2026-10-11 failed here in the audit's own run of this
# flow, having passed in all 13 flows before it in the same session, with the
# optional tap above reporting no dialog to clear. A longer wait cannot hide a
# real regression — a ledger that never appears still fails, 20 seconds later.
- extendedWaitUntil:
    visible: "Your ledger"
    timeout: 20000
