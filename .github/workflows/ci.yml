name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # RN component tests live in an isolated jest project (apps/mobile,
      # `*.rntest.tsx`) because react-native can't load under vitest's node
      # environment. `npm test` does not reach them; this step does.
      - name: RN component tests (jest)
        run: npm run test:rn

      # Coverage floor (standards P5.5). Thresholds live in vitest.config.ts and
      # only ratchet upward; a regression below any floor fails this step.
      - name: Coverage floor
        run: npm run test:coverage

      # Catch build-time breakage (server components, route types, bad imports)
      # that typecheck + unit tests miss. Next build is the web app's real gate.
      - name: Build web
        run: npm run build --workspace @zeno/web

      # Report dependency advisories on every PR/push, but DO NOT fail the build:
      # nothing deploys from a PR, so a fresh upstream advisory shouldn't redden
      # unrelated work (standards §11). The BLOCKING high/critical gate lives in
      # release.yml, which runs before a release actually ships — that's where a
      # new advisory must stop us.
      - name: Dependency audit (report only)
        continue-on-error: true
        run: node scripts/audit-gate.mjs

  # Secret scan over EVERY commit on every ref, not just the diff: a secret that
  # was committed and later "deleted" is still in history and still fails this.
  # Findings are redacted in the log. Reviewed false positives live in
  # .gitleaksignore as exact fingerprints (commit:path:rule:line), each with a
  # reason — never a rule- or path-wide exemption.
  secret-scan:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned version + SHA-256 from the release's official checksums file, so
      # a tampered or swapped download fails here instead of running.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact --no-banner --exit-code 1 .'
