name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the default GITHUB_TOKEN may only read the repo. No job here
# writes anything back (no pushes, no comments, no releases).
permissions:
  contents: read

# One run per ref; a newer push to the same PR cancels the stale run. Pushes to
# main are never cancelled, so every main commit gets a complete verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: typecheck & test
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice); upgrade deliberately
    timeout-minutes: 25
    # A REAL Postgres server for the P2.1 suite (apps/api/src/storage/real-pg.test.ts),
    # which otherwise embeds PGlite. Pinned by digest like every other image here.
    # A throwaway database on the runner's loopback: trust auth, so no password
    # string lives in the repository at all.
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # W7.1: the website's copy, spelled (British English; cspell.json holds
      # the project's own words). Pinned by version, not installed: nothing
      # else in the repository needs it.
      - name: Spelling (website copy)
        run: npx --yes cspell@10.3.6 "apps/web/app/**/*.{ts,tsx}" "apps/web/components/**/*.{ts,tsx}" "apps/web/lib/**/*.ts" "apps/web/public/llms.txt" --no-progress

      - name: Test
        run: npm test

      # Dates are UTC days (ENGINEERING_STANDARDS §10), and this runner's clock
      # is UTC, where a local/UTC mix-up can't show (F181 surfaced only on a
      # UTC+5:30 machine after midnight). Run the suites again far from UTC on
      # both sides.
      - name: Tests far from UTC (UTC-10 and UTC+14)
        shell: bash
        run: |
          TZ=Pacific/Honolulu npm test
          TZ=Pacific/Kiritimati npm test
          TZ=Pacific/Kiritimati npm run test:rn

      # RN component tests live in an isolated jest project (apps/mobile,
      # `*.rntest.tsx`) because react-native can't load under vitest's node
      # environment. `npm test` does not reach them; this step does.
      # A failed coverage FLOOR prints only to the raw log (the github-actions
      # reporter annotates failing tests, not thresholds), so the floor lines and
      # the log's tail become an annotation readable through the public API.
      - name: RN component tests + coverage floor (jest)
        shell: bash
        run: |
          set -o pipefail
          if ! npm run test:rn:coverage 2>&1 | tee "$RUNNER_TEMP/jest.log"; then
            msg=$({ grep -E "coverage threshold|not met|Tests:|Test Suites:" "$RUNNER_TEMP/jest.log"; echo "..."; tail -n 25 "$RUNNER_TEMP/jest.log"; } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=jest failed::${msg}"
            exit 1
          fi

      # Coverage floor (standards P5.5). Thresholds live in vitest.config.ts and
      # only ratchet upward; a regression below any floor fails this step.
      - name: Coverage floor
        run: npm run test:coverage

      # The website's pages and components (P4.1): React Testing Library in
      # jsdom, with their own ratcheting floor in vitest.web.config.ts (the logic
      # floor above is global at 100 % lines, so it cannot take them file by file).
      - name: Website component tests + coverage floor
        run: npm run test:web:coverage

      # Catch build-time breakage (server components, route types, bad imports)
      # that typecheck + unit tests miss. Next build is the web app's real gate.
      # On failure the log's last 40 lines become an annotation, readable through
      # the public API (the raw log needs a login); before this a CI-only build
      # failure showed only "exit code 1" (CI 36845816550).
      #
      # The build runs inside the build-output secret scan (P4.4): every
      # non-public environment name the repository knows is set to a random
      # canary, and the scan fails if any canary is anywhere in apps/web/.next
      # (as written or base64), or if .next holds a kind of file it can't read.
      # The browser tests below then run on this same build.
      - name: Build web (with the build-output secret scan)
        shell: bash
        run: |
          set -o pipefail
          if ! node scripts/build-secret-scan.mjs 2>&1 | tee "$RUNNER_TEMP/web-build.log"; then
            # The first error lines (the cause) and then the last 40 (the context).
            msg=$({ grep -m 8 -iE "error|failed|could not" "$RUNNER_TEMP/web-build.log"; echo "..."; tail -n 40 "$RUNNER_TEMP/web-build.log"; } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Build web failed::${msg}"
            exit 1
          fi

      # The website in a real browser (P4.2): every route on desktop and phone,
      # light and dark: 200, the security headers, no console error, nothing
      # fetched from another host, axe clean at WCAG 2.2 AA. Runs against
      # `next start` over the build above. Uses the runner's installed Google
      # Chrome (channel "chrome"), so no browser is downloaded.
      - name: Website end-to-end (Playwright, installed Chrome)
        working-directory: apps/web
        run: npx playwright test

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      # Software bill of materials (CycloneDX 1.5) for everything the lockfile
      # installs on this runner. The FULL tree on purpose: `npm sbom --omit dev`
      # was verified to DROP shipped packages (expo, react-native) in this
      # workspace layout, so it would be an incomplete inventory. Dev-only
      # packages are marked with the property cdx:npm:package:development=true.
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      # BLOCKING on every push/PR (P0.4). main auto-deploys to production once
      # checks pass (render.yaml autoDeployTrigger: checksPass), so a report-only
      # audit here would let a known high/critical advisory ship. Exceptions are
      # reviewed, reasoned and EXPIRING entries in .audit-allowlist.json.
      - name: Dependency audit (blocking, with expiring allowlist)
        run: node scripts/audit-gate.mjs

  # Secret scan over EVERY commit on every ref, not just the diff: a secret that
  # was committed and later "deleted" is still in history and still fails this.
  # Findings are redacted in the log. Reviewed false positives live in
  # .gitleaksignore as exact fingerprints (commit:path:rule:line), each with a
  # reason — never a rule- or path-wide exemption.
  secret-scan:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice); upgrade deliberately
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned version + SHA-256 from the release's official checksums file, so
      # a tampered or swapped download fails here instead of running.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact --no-banner --exit-code 1 .'

  # Static analysis (SAST) with a ZERO-findings gate. Rule packs: OWASP Top 10,
  # Node, JavaScript, TypeScript, React, Next.js, and GitHub Actions (workflow
  # injection, unpinned actions). Scope and the reasons for each skipped path:
  # .semgrepignore. An accepted finding is suppressed IN the source with
  # `nosemgrep: <rule-id> -- <reason>` next to it, never by widening an ignore.
  # Image pinned by digest (semgrep 1.178.0, multi-arch index).
  sast-semgrep:
    name: SAST (semgrep, zero findings)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice); upgrade deliberately
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan
        run: >-
          semgrep scan --metrics=off --disable-version-check --error
          --config p/owasp-top-ten --config p/nodejs --config p/javascript
          --config p/typescript --config p/react --config p/nextjs
          --config p/github-actions .
