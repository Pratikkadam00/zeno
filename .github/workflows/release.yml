name: Release gate

# Full pre-release verification. Unlike ci.yml (which runs on every PR and only
# *reports* dependency advisories), this workflow is the BLOCKING gate: a fresh
# high/critical advisory must stop a release from going out even if no code
# changed (standards §11). Trigger it by pushing a v* tag or running it manually
# from the Actions tab before cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: verify & audit (blocking)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice); upgrade deliberately
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # RN component tests live in an isolated jest project (apps/mobile,
      # `*.rntest.tsx`) because react-native can't load under vitest's node
      # environment. `npm test` does not reach them; this step does.
      - name: RN component tests + coverage floor (jest)
        run: npm run test:rn:coverage

      - name: Build web
        run: npm run build --workspace @zeno/web

      # Software bill of materials (CycloneDX 1.5) for everything the lockfile
      # installs on this runner. The FULL tree on purpose: `npm sbom --omit dev`
      # was verified to DROP shipped packages (expo, react-native) in this
      # workspace layout, so it would be an incomplete inventory. Dev-only
      # packages are marked with the property cdx:npm:package:development=true.
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      # BLOCKING: a high/critical advisory fails the release. Moderate/low
      # (e.g. current Expo transitive advisories) are surfaced but don't block.
      - name: Dependency audit (blocking, with expiring allowlist)
        run: node scripts/audit-gate.mjs
