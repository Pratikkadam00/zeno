name: Mobile end-to-end (Maestro)

# P5: the release APK, as shipped (HTTPS only, no reachable server), on an
# Android emulator: every Maestro flow in .maestro/ and the accessibility-tree
# audit (.maestro/a11y-audit.sh), nightly. The APK is built the way the local
# loop builds it (expo prebuild, then a single-ABI x86_64 release), so the
# emulator runs exactly what the flows were written against.
#
# It also runs on a push that changes the flows or this file, so a change to
# them is proven when it lands, not the next night.
on:
  schedule:
    - cron: "7 4 * * *" # 04:07 UTC daily, after the fuzz and DAST runs (off the hour)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .maestro/**
      - .github/workflows/mobile-e2e.yml

permissions:
  contents: read

concurrency:
  group: mobile-e2e
  cancel-in-progress: false

env:
  MAESTRO_VERSION: "2.11.0"
  # The release zip's SHA-256 (the release's checksums_sha256.txt and GitHub's
  # asset digest, read 2026-10-03).
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
  # Maestro's anonymous analytics off (any value; read from its code).
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "1"

jobs:
  maestro:
    name: Maestro flows and the accessibility audit (release APK, emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      # Java 21: what the local loop builds with (measured working); the first
      # run's build failed on 17.
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build the release APK (x86_64)
        working-directory: apps/mobile
        env:
          # No Sentry project yet (owner item); the upload task would fail.
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        shell: bash
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install
          cd android
          # On failure, Gradle's "What went wrong" becomes an annotation: the raw
          # log needs a login, annotations are readable through the public API.
          if ! ./gradlew assembleRelease -x lint -PreactNativeArchitectures=x86_64 --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            msg=$({ grep -A 14 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -30; echo "..."; tail -n 15 "$RUNNER_TEMP/gradle.log"; } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=APK build failed::${msg}"
            # R8 prints its cause above "What went wrong" ("Compilation failed to
            # complete" alone says nothing): its own error lines, as a second one.
            r8=$({ grep -E "ERROR|Missing class|OutOfMemoryError|R8:|Caused by" "$RUNNER_TEMP/gradle.log" | grep -v "^> Task" | head -40 || true; } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=APK build errors (R8 and compiler lines)::${r8:-none matched}"
            exit 1
          fi

      - name: Install Maestro (pinned, checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro"
          echo "$HOME/.maestro/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Flows and audit on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          script: bash .maestro/ci.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk emulator-5554

      - name: Keep the Maestro logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-logs
          path: |
            ~/.maestro/tests
            /tmp/maestro-*.log
            /tmp/zeno-a11y
          retention-days: 14
