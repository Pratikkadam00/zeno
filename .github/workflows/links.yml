name: Link check

# W6.5 (docs/WEB_PLAN.md): every link on the live site, followed nightly.
# A broken internal link fails the job; broken external links (mostly the
# services' own cancellation pages, which move) are listed in the summary for
# the catalogue to be updated. GitHub runs schedules hours late on this repo;
# that is fine for a nightly.
on:
  schedule:
    - cron: "23 4 * * *" # 04:23 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/links.yml"
      - "scripts/link-check.mjs"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Follow every link on the live site
        run: |
          set -o pipefail
          node scripts/link-check.mjs https://zenoapp.in 2>&1 | tee link-check.log

      - name: Summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat link-check.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Failure detail as an annotation
        if: failure()
        run: |
          detail=$(grep -A20 "not 200" link-check.log | head -n 20 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Broken internal links::${detail}"
