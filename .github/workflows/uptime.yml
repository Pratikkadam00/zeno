name: Uptime

# P8: is the production API up and its database reachable? A manual check and a
# backstop: GitHub's schedule is best-effort (here it fired twice in ~11 hours), so
# the real alert is an outside monitor (docs/RUNBOOKS.md section 6).
# (scripts/uptime-check.mjs: /api/v1/health/ready must answer 200, "ready", every
# check "ok"; one retry after 30 s covers a free instance waking up.) A failed
# scheduled run is emailed to whoever last changed this schedule.
#
# OFF until the owner turns it on, because each check wakes a sleeping free
# Render instance and spends the workspace's free instance hours: set the
# repository variable UPTIME_CHECKS to "on" (Settings > Secrets and variables >
# Actions > Variables). Run it by hand any time with "Run workflow".
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    name: API ready
    if: github.event_name == 'workflow_dispatch' || vars.UPTIME_CHECKS == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Check /api/v1/health/ready
        run: node scripts/uptime-check.mjs
