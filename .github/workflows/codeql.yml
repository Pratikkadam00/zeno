name: CodeQL

# Semantic SAST (data-flow: injection, XSS, SSRF, path traversal, crypto misuse)
# over the TypeScript/JavaScript in apps/ and packages/, with GitHub's
# security-extended query suite. Complements semgrep's pattern rules.
#
# Results go to the Security tab AND through scripts/sarif-gate.mjs, which
# prints every finding as a run annotation (readable by anyone who can read the
# repo) and FAILS the job on any unsuppressed result.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly, so new queries run against unchanged code

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (javascript-typescript, security-extended)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice); upgrade deliberately
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (for the SARIF gate)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - "**/*.test.ts"
              - "**/*.test.tsx"
              - "**/*.rntest.tsx"
              - "Zeno Design System/**"
              - "apps/mobile/android/**"
              - "**/.next/**"

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:javascript-typescript"
          output: sarif-results

      - name: Gate - zero findings (each printed as an annotation)
        run: node scripts/sarif-gate.mjs sarif-results
