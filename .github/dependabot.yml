# Dependabot — version updates for npm (all workspaces, one root lockfile) and
# GitHub Actions. Security updates are a repository setting (Settings → Code
# security → Dependabot security updates) and are NOT affected by anything here
# except `ignore`, which is why this file deliberately ignores nothing: per
# GitHub's options reference, `ignore` applies to BOTH version and security
# updates, so ignoring the Expo packages would also block their security fixes.
#
# Instead, the Expo/React Native packages that must move together with the SDK
# are GROUPED. React Native and Expo treat a MINOR version as breaking (the
# first grouped PR proposed react-native 0.85.3 -> 0.87.1 as a "minor"; Expo SDK
# 56 pins 0.85). So only PATCH updates of these packages form the routine
# `expo-sdk-patch` group; minor + major land together in `expo-sdk-upgrade`,
# which is an SDK upgrade to do deliberately with `npx expo install --fix`,
# never to merge as-is.
#
# `cooldown` (version updates only; security updates are never delayed) waits
# 7+ days after a release before proposing it: most malicious npm releases are
# caught and unpublished within that window (semgrep
# dependabot-missing-cooldown requires >= 7).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      expo-sdk-patch:
        applies-to: version-updates
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
          - "@react-native/*"
          - "@react-native-async-storage/*"
        update-types: [patch]
      expo-sdk-upgrade:
        applies-to: version-updates
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
          - "@react-native/*"
          - "@react-native-async-storage/*"
        update-types: [minor, major]
      everything-else-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
