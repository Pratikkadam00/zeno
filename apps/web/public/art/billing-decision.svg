 stroke="#e5e3d9"/><text x="674" y="253" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#14161f" text-anchor="start">1.  Play Store</text><rect x="650" y="300" width="440" height="68" rx="10" fill="#ffffff" stroke="#e5e3d9"/><text x="674" y="343" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#14161f" text-anchor="start">2.  Profile picture</text><rect x="650" y="390" width="440" height="68" rx="10" fill="#ffffff" stroke="#e5e3d9"/><text x="674" y="433" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#14161f" text-anchor="start">3.  Payments &amp; subscriptions</text><rect x="650" y="480" width="440" height="68" rx="10" fill="#ffffff" stroke="#e5e3d9"/><text x="674" y="523" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#c63b49" text-anchor="start">4.  Subscriptions → Cancel</text><text x="80" y="660" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a6072" text-anchor="start">Written from the app stores' own screens; the names can shift slightly between versions.</text></svg>