ke-width="1"/><rect x="80" y="77" width="11" height="3" fill="#00c26e"/><text x="100" y="90" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#6b7184" text-anchor="start" letter-spacing="2.5">WHO BILLS YOU DECIDES WHERE YOU CANCEL</text><rect x="80" y="130" width="500" height="480" rx="12" fill="#ffffff" stroke="#c9c7ba"/><text x="110" y="180" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14161f" text-anchor="start">Billed by the service</text><text x="110" y="222" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a6072" text-anchor="start">The receipt names the service.</text><text x="110" y="300" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#6b7184" text-anchor="start" letter-spacing="1.5">Cancel at:</text><text x="110" y="340" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#14161f" text-anchor="start">the service's own account page</text><text x="110" y="420" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#6b7184" text-anchor="start" letter-spacing="1.5">Deleting the app:</text><text x="110" y="460" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#c63b49" text-anchor="start">changes nothing</text><text x="110" y="560" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#14161f" text-anchor="start">Example receipt from</text><line x1="374" y1="556" x2="443" y2="556" stroke="#6b7184" stroke-width="1.5" stroke-dasharray="1 6" stroke-linecap="round"/><text x="550" y="560" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="22" font-weight="600" fill="#14161f" text-anchor="end">Netflix</text><rect x="620" 