<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#faf9f5"/><line x1="0" y1="36" x2="1200" y2="36" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="72" x2="1200" y2="72" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="108" x2="1200" y2="108" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="144" x2="1200" y2="144" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="180" x2="1200" y2="180" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="216" x2="1200" y2="216" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="252" x2="1200" y2="252" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="288" x2="1200" y2="288" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="324" x2="1200" y2="324" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="360" x2="1200" y2="360" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="396" x2="1200" y2="396" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="432" x2="1200" y2="432" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="468" x2="1200" y2="468" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="504" x2="1200" y2="504" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="540" x2="1200" y2="540" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="576" x2="1200" y2="576" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="612" x2="1200" y2="612" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><line x1="0" y1="648" x2="1200" y2="648" stroke="#14161f" stroke-opacity="0.065" stroke-width="1"/><rect x="80" y="77" width="11" height="3" fill="#00c26e"/><text x="100" y="90" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#6b7184" text-anchor="start" letter-spacing="2.5">WHERE DO YOU CANCEL IT?</text><rect x="400" y="130" width="400" height="90" rx="14" fill="#14161f"/><text x="600" y="185" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#faf9f5" text-anchor="middle">Who sent the receipt?</text><path d="M600 220 v40 M600 260 h-320 v40 M600 260 h320 v40" fill="none" stroke="#6b7184" stroke-width="2.5"/><rect x="80" y="300" width="400" height="230" rx="14" fill="#ffffff" stroke="#c9c7ba"/><text x="110" y="350" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14161f" text-anchor="start">The service itself</text><text x="110" y="400" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a6072" text-anchor="start">Cancel on its website, in your account.</text><text x="110" y="436" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a6072" text-anchor="start">Keep the confirmation email.</text><text x="110" y="500" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#057a46" text-anchor="start" letter-spacing="2">WEBSITE</text><rect x="720" y="300" width="400" height="230" rx="14" fill="#ffffff" stroke="#c9c7ba"/><text x="750" y="350" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14161f" text-anchor="start">Apple or Google</text><text x="750" y="400" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a6072" text-anchor="start">Cancel in the store's subscriptions screen.</text><text x="750" y="436" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a6072" text-anchor="start">The website cannot reach it.</text><text x="750" y="500" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#057a46" text-anchor="start" letter-spacing="2">APP STORE · GOOGLE PLAY</text><text x="80" y="620" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#c63b49" text-anchor="start">Deleting the app does neither.</text></svg>